name: Reusable Claude Code Review

# Reusable workflow that runs the Claude Code review action on a PR.
# Consumers gate this with their own `on:` trigger — typically
# `pull_request: [labeled]` (label-driven path) or `workflow_dispatch`
# (dispatched-from-auto-labeller path; see `claude-auto-label.yml`).
#
# When called from `workflow_dispatch`, the consumer must pass `pr_number`
# (there is no implicit `github.event.pull_request` context to fall back on).
# The legacy `pull_request: [labeled]` path can omit `pr_number` and the
# workflow will resolve it from `github.event.pull_request.number`.
#
# Opt-out: if the PR body contains `[skip-review]` (case-insensitive) the
# job exits early with a single log line. This replaces the old
# label-removal opt-out, which no longer works once the review is
# dispatched programmatically.

on:
  workflow_call:
    inputs:
      model:
        description: Claude model name to use for the review
        type: string
        default: claude-sonnet-4-6
      extra_focus:
        description: Optional repo-specific bullets appended to the review focus list
        type: string
        default: ""
      pr_number:
        description: PR number to review. Required when called via workflow_dispatch
          (no implicit pull_request context). Leave empty for the legacy label-trigger
          path; the workflow falls back to github.event.pull_request.number.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr_number }}
          FALLBACK_PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$PR_INPUT" ]; then
            PR_NUMBER="$PR_INPUT"
          else
            PR_NUMBER="$FALLBACK_PR"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No PR number resolved (neither pr_number input nor pull_request context available)."
            exit 1
          fi
          PR_DATA=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefName,headRefOid,body)
          HEAD_REF=$(printf '%s' "$PR_DATA" | jq -r '.headRefName')
          HEAD_SHA=$(printf '%s' "$PR_DATA" | jq -r '.headRefOid')
          BODY=$(printf '%s' "$PR_DATA" | jq -r '.body // ""')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if printf '%s' "$BODY" | grep -qi '\[skip-review\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip review (PR body contains [skip-review])
        if: steps.pr.outputs.skip == 'true'
        run: |
          echo "PR #${{ steps.pr.outputs.pr_number }} opted out of review via [skip-review] marker in body."

      - uses: actions/checkout@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.pr_number }}

            Review this PR. Focus on:
            - Real bugs and correctness issues
            - Security problems
            - Anything that breaks this repo's existing conventions
            ${{ inputs.extra_focus }}

            Rules:
            - Skip nits, style preferences, and micro-optimizations.
            - Be terse — one-line findings where possible, no preamble.
            - If the PR is clean, say so in a single sentence.
            - Always cite `file:line` for specific issues.
            - Do not flag issues you have already raised on a previous commit
              of this PR.

            The PR branch is already checked out.
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific code issues.
            Only post GitHub comments — don't submit review text as messages.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
